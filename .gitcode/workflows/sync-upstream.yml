# .atomgit/workflows/sync-upstream.yml
# 功能：每周五自动将 Linux 官方 stable/linux-6.6.y 分支同步到 ALK-6.6-upstream
# 仓库：https://atomgit.com/openairymax/kernel
# 维护者：Zhixian_Zhou (zhouzhixian@spharx.cn)

name: Sync Upstream LTS

on:
  # 定时触发：每周五 UTC 4:00（即北京时间 12:00）
  schedule:
    - cron: '0 4 * * 5'
  # 手动触发：允许在 AtomGit 界面手动运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出 ALK-6.6-upstream 分支
      - name: Checkout ALK-6.6-upstream
        uses: actions/checkout@v4
        with:
          ref: 'ALK-6.6-upstream'
          fetch-depth: 0   # 获取完整提交历史，便于快进合并

      # 2. 配置 Git 用户信息（用于提交合并记录）
      - name: Configure Git
        run: |
          git config --global user.name 'Zhixian_Zhou'
          git config --global user.email 'zhouzhixian@spharx.cn'

      # 3. 添加 Linux 官方稳定版仓库为上游源
      - name: Add upstream repository
        run: |
          git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git

      # 4. 拉取官方 linux-6.6.y 分支的最新代码
      - name: Fetch upstream LTS branch
        run: |
          git fetch upstream linux-6.6.y

      # 5. 尝试快进合并（仅当可以快进时才合并，否则失败）
      - name: Merge upstream into ALK-6.6-upstream
        id: merge
        run: |
          if git merge --ff-only upstream/linux-6.6.y; then
            echo "MERGE_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "MERGE_SUCCESS=false" >> $GITHUB_ENV
            echo "❌ 合并失败，可能分支分叉，需要人工介入。"
            exit 1
          fi

      # 6. 如果合并成功，推送到 AtomGit 远程仓库
      - name: Push changes
        if: env.MERGE_SUCCESS == 'true'
        run: |
          git remote set-url origin https://${{ secrets.GIT_KEY }}@atomgit.com/openairymax/kernel.git
          git push origin ALK-6.6-upstream